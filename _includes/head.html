<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

<title>{% if post.title %}{{ post.title }} | {{ page.title }}{% else %}{{ site.title }}{% endif %}</title>

<link rel="stylesheet" href="{{ site.baseurl }}/node_modules/reveal.js/css/reveal.css">

<link rel="stylesheet" href="{{site.baseurl}}/node_modules/reveal.js/css/reset.css">
<link rel="stylesheet" href="{{site.baseurl}}/node_modules/reveal.js/css/reveal.css">
<link rel="stylesheet" href="{{site.baseurl}}/node_modules/reveal.js/css/theme/moon.css">

<!-- Theme used for syntax highlighting of code -->
<link rel="stylesheet" href="{{site.baseurl}}/node_modules/reveal.js/lib/css/monokai.css">

<style>
	.mobile-bottom-menu {
		bottom: 1rem;
		display: none;
		gap: 0.5rem;
		position: fixed;
		right: 1rem;
		z-index: 40;
	}

	.mobile-bottom-menu__actions {
		display: flex;
		gap: 0.5rem;
		max-width: 0;
		opacity: 0;
		overflow: hidden;
		transition: max-width 180ms ease, opacity 180ms ease;
	}

	.mobile-bottom-menu.is-open .mobile-bottom-menu__actions {
		max-width: calc(100vw - 5.5rem);
		opacity: 1;
	}

	.mobile-bottom-menu__button {
		align-items: center;
		background: rgba(17, 17, 17, 0.88);
		border: 1px solid rgba(255, 255, 255, 0.35);
		border-radius: 999px;
		box-shadow: 0 0.25rem 0.75rem rgba(0, 0, 0, 0.28);
		color: #fff;
		cursor: pointer;
		display: inline-flex;
		font: 600 0.85rem/1.1 sans-serif;
		justify-content: center;
		min-height: 2.75rem;
		min-width: 2.75rem;
		padding: 0 0.9rem;
		white-space: nowrap;
	}

	.mobile-bottom-menu__toggle {
		font-size: 1.25rem;
		padding: 0;
	}

	@media (max-width: 700px) {
		.mobile-bottom-menu {
			display: flex;
		}
	}
</style>


<!-- Printing and PDF exports -->
<script>
	var link = document.createElement( 'link' );
	link.rel = 'stylesheet';
	link.type = 'text/css';
	link.href = window.location.search.match( /print-pdf/gi ) ? 'css/print/pdf.css' : 'node_modules/reveal.js/css/print/paper.css';
	document.getElementsByTagName( 'head' )[0].appendChild( link );
</script>
